<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nothing special</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Times New Roman', Times, serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      user-select: none;
    }

    .title {
      font-size: clamp(2.4rem, 7vw, 5.5rem);
      font-weight: 100;
      -webkit-text-stroke: 1px #000;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      white-space: nowrap;
      color: #fff;
    }

    /* CA */
    .ca-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .ca {
      font-family: 'Courier New', monospace;
      font-size: clamp(0.6rem, 1.8vw, 0.78rem);
      color: #444;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }

    .ca-wrap:hover .ca {
      color: #666;
    }

    .copy-icon {
      opacity: 0;
      transition: opacity 0.2s;
    }

    .ca-wrap:hover .copy-icon {
      opacity: 1;
    }

    .copied-msg {
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      color: #555;
      letter-spacing: 0.1em;
      height: 14px;
      transition: opacity 0.3s;
      opacity: 0;
    }

    .copied-msg.show {
      opacity: 1;
    }

    /* Social icons */
    .icons {
      display: flex;
      gap: 28px;
      margin-top: 4px;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: none;
      background: none;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.2s;
      text-decoration: none;
      color: #fff;
    }

    .icon-btn:hover {
      opacity: 0.75;
    }

    .icon-btn svg,
    .icon-btn img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      fill: currentColor;
    }

    #dexLink img,
    #redditLink img {
      width: 23px;
      height: 23px;
    }

    @media (max-width: 600px) {
      .title {
        font-size: min(2.4rem, 9.5vw);
        font-weight: 200;
        -webkit-text-stroke: 0.6px #000;
      }

      .ca {
        font-size: clamp(0.5rem, 2.5vw, 0.6rem);
      }
    }
  </style>
</head>
<body>
  <div class="center">
    <div class="title">nothing special</div>

    <div class="ca-wrap" id="caWrap" title="click to copy">
      <span class="ca" id="caText">0x0000000000000000000000000000000000000000</span>
      <!-- copy icon -->
      <svg class="copy-icon" width="12" height="12" viewBox="0 0 16 16" fill="#444" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="#444" stroke-width="1.5" fill="none"/>
        <path d="M3 11H2a1 1 0 01-1-1V2a1 1 0 011-1h8a1 1 0 011 1v1" stroke="#444" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="copied-msg" id="copiedMsg">copied</div>

    <div class="icons">
      <!-- Telegram -->
      <a class="icon-btn" href="https://t.me/nothingthatspecial" id="tgLink" title="Telegram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M21.9 4.6l-3.2 15.1c-.24 1.07-.87 1.34-1.75.83l-4.87-3.59-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.96 9.03-8.16c.39-.35-.09-.54-.61-.19L6.36 13.36l-4.8-1.5c-1.04-.33-1.06-1.04.22-1.54L20.54 3.1c.87-.32 1.63.21 1.36 1.5z" fill="currentColor"/>
        </svg>
      </a>

      <!-- DexScreener -->
      <a class="icon-btn" href="https://dexscreener.com/" id="dexLink" title="DexScreener" target="_blank" rel="noopener">
        <img src="../assets/dexscreener-logo.png" alt="DexScreener" />
      </a>

      <!-- Reddit -->
      <a class="icon-btn" href="https://www.reddit.com/user/itsnothingspecial/" id="redditLink" title="Reddit" target="_blank" rel="noopener">
        <img src="../assets/reddit-logo.png" alt="Reddit" />
      </a>
    </div>
  </div>

  <script>
    const CA = '0x0000000000000000000000000000000000000000';

    document.getElementById('caWrap').addEventListener('click', () => {
      navigator.clipboard.writeText(CA).then(() => {
        const msg = document.getElementById('copiedMsg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 1500);
      });
    });
  </script>
</body>
</html>
